name: build

on:
  push:
  # GitHub evicts caches that are not read for 7 days. A run twice a week
  # keeps the test-resources cache alive when nobody is pushing.
  schedule:
    - cron: '23 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]
    name: JDK ${{ matrix.java }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
          cache: 'maven'
      # Files fetched by download-maven-plugin. The key changes with pom.xml so a
      # new cache is written when downloads are added or changed; restore-keys
      # falls back to the newest older cache so unchanged files never hit the network.
      - name: Restore downloaded test resources
        id: test-resources
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/.cache/download-maven-plugin
          key: sambox-test-resources-${{ hashFiles('pom.xml') }}
          restore-keys: |
            sambox-test-resources-
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
      # Saved even when the build fails, so one dead link or a failing test
      # does not throw away everything that did download.
      - name: Save downloaded test resources
        if: ${{ !cancelled() && steps.test-resources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/.cache/download-maven-plugin
          key: ${{ steps.test-resources.outputs.cache-primary-key }}
